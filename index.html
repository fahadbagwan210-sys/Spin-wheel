
<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#ffecd2;font-family:sans-serif;overflow:hidden}
#game{width:100vw;height:100vh;max-width:420px;margin:auto;background:linear-gradient(#87e0ff 0 40%,#8a6a4a 40% 100%);position:relative;overflow:hidden}
#road{position:absolute;bottom:0;width:100%;height:60%;background:#444;border-top:8px solid #fff}
#player{position:absolute;left:50px;bottom:120px;font-size:50px;transition:bottom 0.15s}
#score{position:absolute;top:15px;left:15px;background:white;padding:8px 16px;border-radius:20px}
.obstacle{position:absolute;bottom:110px;font-size:45px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:20px;display:none;text-align:center;border:4px solid black}
</style></head>
<body>
<div id="game" onclick="jump()">
<div id="score">Rs <span id="s">0</span> Bachaye</div>
<div id="road"></div>
<div id="player">🏍️</div>
<div id="msg"><h2>Gaddhe me gir gaya! 🤕</h2><button onclick="location.reload()">Phir Se</button></div>
</div>
<script>
let p=document.getElementById('player'),s=0,j=false,over=false,obs=[],speed=4;
function jump(){if(j||over)return;j=true;p.style.bottom='220px';setTimeout(()=>{p.style.bottom='120px';setTimeout(()=>j=false,150)},300)}
function make(){if(over)return;let d=document.createElement('div');d.className='obstacle';d.innerText=['🕳️','🐄','🛺','🚧'][Math.floor(Math.random()*4)];d.style.left='400px';document.getElementById('game').appendChild(d);obs.push(d);setTimeout(make,800)}
function loop(){if(over)return;obs.forEach((o,i)=>{let l=parseInt(o.style.left)||400;o.style.left=(l-speed)+'px';if(l<100&&l>20&&!j&&parseInt(p.style.bottom)<160){over=true;document.getElementById('msg').style.display='block';p.innerText='🤕'}if(l<-50){o.remove();obs.splice(i,1);s+=100;document.getElementById('s').innerText=s}});requestAnimationFrame(loop)}
make();loop();
document.addEventListener('touchstart',e=>{e.preventDefault();jump()})
</script></body></html>
