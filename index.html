<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ 20000 - Bird System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
body{margin:0; background:#0f0e0c; overflow:hidden; font-family:'Space Grotesk',sans-serif; color:#fff;}
#intro{position:relative; width:100vw; height:100vh; background: radial-gradient(ellipse at 30% 20%, #2a241a 0%, #0f0e0c 70%); overflow:hidden;}
canvas{position:absolute; top:0; left:0; width:100%; height:100%;}
#title{position:absolute; top:8%; left:6%; font-size: clamp(28px, 6vw, 58px); line-height:0.9; z-index:5; mix-blend-mode: difference;}
#title span{color:#ff6a00;}
#branch{position:absolute; bottom:32%; left:5%; width:90%; height:8px; background: linear-gradient(90deg, #3d2810, #8a5a2a); border-radius:10px; transform-origin:left; transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); z-index:3;}
#branch::before{content:'🌿'; position:absolute; right:18%; top:-34px; font-size:42px; filter:drop-shadow(0 10px 10px black);}
#startWrap{position:absolute; bottom:12%; left:50%; transform:translateX(-50%); z-index:10;}
#startBtn{padding:18px 48px; font-size:20px; background:#fff; color:#000; border:none; border-radius:100px; font-weight:800; letter-spacing:1px; opacity:0; transform: scale(0.7) translateY(30px); transition: all 0.8s cubic-bezier(.34,1.56,.64,1); cursor:pointer; box-shadow: 0 0 0 0 rgba(255,255,255,0.5);}
#startBtn.show{opacity:1; transform: scale(1) translateY(0); box-shadow: 0 0 0 20px rgba(255,255,255,0);}
#startBtn:hover{transform: scale(1.05); background:#ff6a00; color:#fff;}

#game{display:none; width:100vw; min-height:100vh; background:#faf7ef; color:#111; padding:20px; box-sizing:border-box;}
.grid{display:grid; grid-template-columns:repeat(4, 78px); gap:14px; justify-content:center; margin:30px auto;}
.cell{width:78px; height:78px; background:#fff; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:34px; cursor:pointer; box-shadow:0 10px 20px rgba(0,0,0,0.08), inset 0 0 0 2px #e8d9a0; transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), background 0.3s; transform-style: preserve-3d;}
.cell:hover{transform: translateY(-4px) rotateX(10deg);}
.cell.solved{background:#111; color:#fff; box-shadow:0 0 30px #ff6a00;}
</style>
</head>
<body>

<div id="intro">
  <canvas id="c"></canvas>
  <div id="title">ARROW<br><span>PUZZLE</span><br>SYSTEM</div>
  <div id="branch"></div>
  <div id="startWrap"><button id="startBtn" onclick="openGame()">INITIALIZE ▶</button></div>
</div>

<div id="game">
  <h1 style="text-align:center; font-size:40px; margin:10px;">NEURO ARROW PUZZLE 🧠</h1>
  <p style="text-align:center; opacity:0.6;">All arrows → CENTER. IQ 20000 only.</p>
  <div class="grid" id="grid"></div>
  <h2 id="msg" style="text-align:center;"></h2>
  <div style="text-align:center;"><button onclick="newLevel()" style="padding:12px 30px; border-radius:100px; border:none; background:#111; color:#fff; font-weight:bold;">NEXT LEVEL →</button></div>
</div>

<script>
// ADVANCED BIRD PHYSICS CANVAS
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width=innerWidth*2; canvas.height=innerHeight*2; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; ctx.scale(2,2);}
resize(); window.onresize=resize;

let t=0, landed=false;
let bird = {x:-100, y:150, vx:0, vy:0, wing:0};

function animate(){
  t+=0.016;
  ctx.clearRect(0,0,innerWidth,innerHeight);

  // Motion trail
  if(!landed){
    // Bezier flight path
    let p = Math.min(t/2.5,1);
    let bx = -100 + (innerWidth*0.72+100)*p + Math.sin(t*8)*4;
    let by = innerHeight*0.15 + (innerHeight*0.35)* (1 - Math.pow(1-p,3)) + Math.sin(t*3)*15;
    bird.x=bx; bird.y=by;
    bird.wing+=0.5 + p*0.5;

    // Bird
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(Math.sin(t*2)*0.2 - (1-p)*0.4);
    // body
    ctx.fillStyle='#ff6a00';
    ctx.beginPath(); ctx.ellipse(0,0,22,14,0,0,Math.PI*2); ctx.fill();
    // wing flap
    let flap = Math.sin(bird.wing)*18;
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.ellipse(-4, flap*0.3, 18, 8, flap*0.05,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-4, -flap*0.3, 18, 8, -flap*0.05,0,Math.PI*2); ctx.fill();
    // eye
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(10,-4,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(12,-4,2,0,Math.PI*2); ctx.fill();
    // beak
    ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(32,-4); ctx.lineTo(32,4); ctx.fill();
    ctx.restore();

    // trail dots
    ctx.fillStyle='rgba(255,106,0,0.15)';
    ctx.beginPath(); ctx.arc(bx-15, by+5, 4+Math.random()*4,0,Math.PI*2); ctx.fill();

    if(p>=1 &&!landed){
      landed=true;
      document.getElementById('branch').style.transform='rotate(-3deg) scaleY(1.2)';
      setTimeout(()=>document.getElementById('branch').style.transform='rotate(1deg)',300);
      setTimeout(()=>document.getElementById('branch').style.transform='rotate(0deg)',600);
      document.getElementById('startBtn').classList.add('show');
      // shake
      document.body.animate([{transform:'translateX(0)'},{transform:'translateX(2px)'},{transform:'translateX(0)'}],{duration:200});
    }
  } else {
    // landed idle
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(Math.sin(t)*0.05);
    ctx.fillStyle='#ff6a00'; ctx.beginPath(); ctx.ellipse(0,0,22,14,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(-4,0,18,7,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(animate);
}
animate();

function openGame(){
  document.getElementById('intro').animate([{opacity:1},{opacity:0}],{duration:600, fill:'forwards'});
  setTimeout(()=>{ document.getElementById('intro').style.display='none'; document.getElementById('game').style.display='block'; newLevel(); },600);
}

// ADVANCED PUZZLE - 4x4 with logic
let arrows=['↑','→','↓','←'], board=[];
function newLevel(){
  board=[]; let g=document.getElementById('grid'); g.innerHTML=''; document.getElementById('msg').innerText='';
  for(let i=0;i<16;i++){
    board[i]= i==10? 8 : Math.floor(Math.random()*4);
    let d=document.createElement('div'); d.className='cell'; d.id='c'+i;
    d.innerText= i==10? '🎯' : arrows[board[i]];
    d.onclick=()=>rotate(i);
    g.appendChild(d);
  }
}
function rotate(i){
  if(i==10) return;
  board[i]=(board[i]+1)%4;
  let el=document.getElementById('c'+i);
  el.style.transform='rotateY(90deg) scale(0.8)';
  setTimeout(()=>{ el.innerText=arrows[board[i]]; el.style.transform='rotateY(0deg)'; checkWin(); },150);
}
function checkWin(){
  let center=10;
  let win=true;
  // check if all point roughly to center (10)
  for(let i=0;i<16;i++){
    if(i==center) continue;
    let r=Math.floor(i/4), c=i%4, cr=Math.floor(center/4), cc=center%4;
    let dr=cr-r, dc=cc-c;
    let need = Math.abs(dr)>Math.abs(dc)? (dr>0?2:0) : (dc>0?1:3);
    let alt = Math.abs(dr)==Math.abs(dc)? [0,1,2,3] : [need, (need+1)%4, (need+3)%4];
    // allow 2 directions for diagonal tolerance - makes it solvable but hard
    if(!alt.includes(board[i]) && Math.abs(dr)!=Math.abs(dc)) win=false;
  }
  if(win){ document.getElementById('msg').innerText='🧠 IQ 20000 VERIFIED - LEVEL CLEARED'; document.querySelectorAll('.cell').forEach(c=>c.classList.add('solved')); confetti(); }
}
function confetti(){
  for(let i=0;i<40;i++){
    let d=document.createElement('div'); d.style.position='fixed'; d.style.left=Math.random()*100+'vw'; d.style.top='-10px'; d.style.width='8px'; d.style.height='8px'; d.style.background=['#ff6a00','#111','#ffcc00'][Math.floor(Math.random()*3)]; d.style.transform='rotate
